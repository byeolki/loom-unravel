[project]
name = "unravel"
version = "0.1.0"
description = "Character illustration to layered face-part decomposition"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "opencv-python>=4.8",
  "pillow>=10.0",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "huggingface_hub>=0.20",
  "jsonschema>=4.20",
  "diffusers>=0.27",
  "transformers>=4.38",
  "accelerate>=0.27",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
unravel = "unravel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
